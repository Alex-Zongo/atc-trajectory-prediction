[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-forecast"
version = "0.1.0"
description = "Two-stage aircraft trajectory forecasting under ATC clearance uncertainty."
requires-python = ">=3.11"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
keywords = ["air traffic control", "trajectory prediction", "flow matching",
            "uncertainty quantification", "ADS-B", "ASR"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "torch>=2.2",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# historical ADS-B collection (OpenSky Trino backend)
collect = ["pyopensky>=2.16"]
# speech recognition for real audio
asr = ["faster-whisper>=1.0", "srt>=3.5"]
# interactive viewer
app = ["streamlit>=1.30"]
# experiment tracking
track = ["wandb>=0.17"]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]
all = ["atc-forecast[collect,asr,app,track,dev]"]

[project.scripts]
atcf-collect = "atc_forecast.collect.opensky:main"
atcf-build = "scripts.build_dataset:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atc_forecast.channel" = ["profiles/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
