<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
/*__BASE_CSS__*/
body { padding: 4px 2px; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.top .sp { flex: 1; }
#pipe { width: 100%; height: 236px; display: block; }
.node rect { fill: var(--surface); stroke: var(--border); stroke-width: 1.2; transition: fill .25s, stroke .25s; }
.node:hover rect { stroke: var(--text2); }
.node.sel rect { stroke: var(--text); stroke-width: 2; fill: var(--surface2); }
.node.lit rect { fill: color-mix(in srgb, var(--belief) 14%, var(--surface)); stroke: var(--belief); }
.node.input rect { stroke-dasharray: 4 3; fill: var(--surface2); }
.node .t1 { font-size: 12px; font-weight: 650; fill: var(--text); }
.node .t2 { font-size: 10.5px; fill: var(--muted); font-family: var(--mono); }
.edge { fill: none; stroke: var(--border); stroke-width: 1.5; }
.loop { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.packet { fill: var(--belief); }
#detail { border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-height: 700px; }
.dh { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.dh .shape { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.lede { color: var(--text2); max-width: 1000px; margin: 2px 0 12px; }
.ctrls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
canvas.hm { image-rendering: pixelated; border-radius: 4px; display: block; }
.legend-inline { display: inline-flex; gap: 12px; font-size: 11.5px; color: var(--text2); flex-wrap: wrap; }
.legend-inline i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
.kv .k { color: var(--muted); }
.axis-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
.big-t { font-family: var(--mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="top">
  <button class="btn primary" id="play">▶ Run forward pass</button>
  <span class="muted" id="status">Click any block to look inside it.</span>
  <span class="sp"></span>
  <span class="chip mono" id="inputchip"></span>
</div>
<svg id="pipe"></svg>
<div id="detail"></div>
<script>/*__PAYLOAD__*/</script>
<script>/*__BASE_JS__*/</script>
<script>
const S = P.trace, D = S.dims, F = S.flow, NS = S.n_steps, K = S.k, H = D.H;
const SA = deq(F.self_attn), CA = deq(F.cross_attn);           // [S, B, heads, H, H|M]
const PV = S.past.valid.map((v, i) => v ? i : -1).filter(i => i >= 0);
$("#inputchip").textContent = `${K} samples · ${NS} Euler steps · guidance ${S.guidance}`;

// ---------------------------------------------------------------------- pipeline diagram
const NODES = [
  { id: "past", x: 0, y: 0, t: "Past ADS-B", s: `${PV.length} obs × 7 + Δt`, input: true },
  { id: "aircraft", x: 0, y: 1, t: "Aircraft", s: `${S.aircraft.wake} · ${S.aircraft.engine} · ${S.aircraft.n_engines}`, input: true },
  { id: "instruction", x: 0, y: 2, t: "Instruction δ", s: "[10]", input: true },
  { id: "noise", x: 0, y: 3, t: "Noise x₀ ~ N(0, I)", s: `[${H} × 4]`, input: true },
  { id: "pastenc", x: 1, y: 0, t: "Past encoder", s: `FiLM · ${D.past_layers} layers`, },
  { id: "acemb", x: 1, y: 1, t: "Aircraft embed", s: `[${D.dim}]` },
  { id: "dirtok", x: 1, y: 2, t: "Axis tokens", s: `3 × ${D.dim}` },
  { id: "memory", x: 2, y: 1, t: "Memory", s: `[${D.mem} × ${D.dim}]` },
  { id: "dit", x: 3, y: 2.4, t: `DiT × ${D.blocks}`, s: `adaLN-zero · ${D.heads} heads` },
  { id: "flow", x: 4, y: 2.4, t: "Integrate the ODE", s: `x ← x + v/${NS}` },
  { id: "output", x: 5, y: 1.2, t: "Controls → path", s: `[${H} × 4] → [${H} × 3]` },
];
const EDGES = [["past", "pastenc"], ["aircraft", "acemb"], ["instruction", "dirtok"], ["pastenc", "memory"], ["dirtok", "memory"], ["acemb", "pastenc"],
  ["memory", "dit"], ["acemb", "dit"], ["noise", "dit"], ["dit", "flow"], ["flow", "output"]];
const svg = d3.select("#pipe"), W = document.body.clientWidth - 6, nw = Math.min(150, (W - 30) / 6 - 26), cg = (W - 6 * nw) / 5.2, nh = 42;
svg.attr("viewBox", `0 0 ${W} 236`);
const pos = n => [4 + n.x * (nw + cg), 8 + n.y * 54];
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
svg.append("defs").append("marker").attr("id", "ar").attr("viewBox", "0 0 10 10").attr("refX", 9).attr("refY", 5).attr("markerWidth", 6).attr("markerHeight", 6)
  .attr("orient", "auto").append("path").attr("d", "M0,0 L10,5 L0,10 z").attr("fill", C.muted);
const edgePath = ([a, b]) => { const [ax, ay] = pos(byId[a]), [bx, by] = pos(byId[b]);
  if (a === "acemb" && b === "pastenc") return `M${ax + nw / 2},${ay} L${bx + nw / 2},${by + nh + 2}`;
  const x1 = ax + nw, y1 = ay + nh / 2, x2 = bx - 2, y2 = by + nh / 2, mx = (x1 + x2) / 2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; };
svg.selectAll("path.edge").data(EDGES).join("path").attr("class", "edge").attr("marker-end", "url(#ar)").attr("d", edgePath).attr("id", (e, i) => "e" + i);
{ const [fx, fy] = pos(byId.flow), [dx] = pos(byId.dit);
  svg.append("path").attr("class", "loop").attr("marker-end", "url(#ar)").attr("d", `M${fx + nw / 2},${fy + nh + 2} C${fx + nw / 2},${fy + nh + 34} ${dx + nw / 2},${fy + nh + 34} ${dx + nw / 2},${fy + nh + 2}`);
  svg.append("text").attr("x", (fx + dx + nw) / 2).attr("y", fy + nh + 38).attr("text-anchor", "middle").attr("font-size", 10.5).attr("fill", C.accent).text(`repeat for t = 0, 1/${NS}, … (flow-time conditions adaLN)`); }
const gN = svg.selectAll("g.node").data(NODES).join("g").attr("class", d => "node" + (d.input ? " input" : "")).attr("transform", d => `translate(${pos(d)})`)
  .style("cursor", "pointer").on("click", (_, d) => select(d.id));
gN.append("rect").attr("width", nw).attr("height", nh).attr("rx", 9);
gN.append("text").attr("class", "t1").attr("x", nw / 2).attr("y", 18).attr("text-anchor", "middle").text(d => d.t);
gN.append("text").attr("class", "t2").attr("x", nw / 2).attr("y", 33).attr("text-anchor", "middle").text(d => d.s);
const packet = svg.append("circle").attr("class", "packet").attr("r", 5).attr("opacity", 0);
let selected = "flow";
const syncSel = () => gN.classed("sel", d => d.id === selected);

// ---------------------------------------------------------------------- helpers
const head = (title, shape, lede) => [el("div", { class: "dh" }, el("h3", {}, title), el("span", { class: "shape" }, shape)), el("p", { class: "lede" }, lede)];
function heat(canvas, rows, opts = {}) {
  const R = rows.length, Cc = rows[0].length, cw = opts.cw || 3, ch = opts.ch || 14;
  canvas.width = Cc * cw; canvas.height = R * ch; canvas.style.width = Cc * cw + "px"; canvas.style.height = R * ch + "px";
  const ctx = canvas.getContext("2d"), m = opts.max || Math.max(1e-6, ...rows.map(r => Math.max(...Array.from(r).map(Math.abs))));
  for (let i = 0; i < R; i++) for (let j = 0; j < Cc; j++) {
    ctx.fillStyle = opts.seq ? seqColor(rows[i][j] / m) : divColor(rows[i][j] / m);
    ctx.fillRect(j * cw, i * ch, cw - (opts.gapx ?? 0), ch - (opts.gap ?? 1));
  }
  canvas.onmousemove = ev => { const r = canvas.getBoundingClientRect(), j = Math.floor((ev.clientX - r.left) / cw), i = Math.floor((ev.clientY - r.top) / ch);
    if (i >= 0 && i < R && j >= 0 && j < Cc) tip.show(opts.label ? opts.label(i, j, rows[i][j]) : `${i}, ${j}: <b>${rows[i][j].toFixed(3)}</b>`, ev); };
  canvas.onmouseleave = () => tip.hide();
}
const matrix = q => { const d = deq(q); return d.shape.length === 1 ? [Array.from(d.data)] : d.slice2().map(r => Array.from(r)); };
const lerp = (a, b, f) => a + (b - a) * f;
const angLerp = (a, b, f) => { const d = ((b - a + 540) % 360) - 180; return (a + d * f + 360) % 360; };
const truthIdx = d3.range(H).filter(i => S.truth.mask[i]);
const unwrapRef = S.past.ctrl.length ? S.past.ctrl[S.past.ctrl.length - 1][1] : 0;
const unwrap = h => ((h - unwrapRef + 540) % 360) - 180 + unwrapRef;

// plan view: east/north with past, truth, and the k samples at a (fractional) ODE step
function planChart(container, w, h, getPaths, opts = {}) {
  const s = d3.select(container).append("svg").attr("width", w).attr("height", h);
  const pts = [...S.past.pos.map(p => [p[0], p[1]]), ...truthIdx.map(i => [S.truth.pos[i][0], S.truth.pos[i][1]]),
    ...F.pos[NS].flat().map(p => [p[0], p[1]])];
  let [x0, x1] = d3.extent(pts, p => p[0]), [y0, y1] = d3.extent(pts, p => p[1]);
  const span = Math.max(x1 - x0, y1 - y0, 0.5) * 1.15, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const sc = Math.min(w - 50, h - 40) / span;
  const X = v => w / 2 + 10 + (v - cx) * sc, Y = v => h / 2 - (v - cy) * sc;
  const gr = s.append("g");
  const step = span > 8 ? 2 : span > 3 ? 1 : .5;
  for (let v = Math.ceil((cx - span) / step) * step; v < cx + span; v += step) gr.append("line").attr("x1", X(v)).attr("x2", X(v)).attr("y1", 0).attr("y2", h).attr("stroke", C.grid);
  for (let v = Math.ceil((cy - span) / step) * step; v < cy + span; v += step) gr.append("line").attr("y1", Y(v)).attr("y2", Y(v)).attr("x1", 0).attr("x2", w).attr("stroke", C.grid);
  s.append("text").attr("x", 6).attr("y", h - 6).attr("font-size", 10).attr("fill", C.muted).text(`grid ${step} nm · north up`);
  const line = d3.line().x(p => X(p[0])).y(p => Y(p[1]));
  s.append("path").attr("d", line(S.past.pos)).attr("fill", "none").attr("stroke", C.past).attr("stroke-width", 2).attr("stroke-dasharray", "3 3");
  s.append("path").attr("d", line(truthIdx.map(i => S.truth.pos[i]))).attr("fill", "none").attr("stroke", C.truth).attr("stroke-width", 3).attr("stroke-opacity", opts.truthAlpha ?? 1);
  const g = s.append("g");
  s.append("circle").attr("cx", X(0)).attr("cy", Y(0)).attr("r", 4.5).attr("fill", C.truth);
  return { update(paths) { g.selectAll("path").data(paths).join("path").attr("d", p => line(p)).attr("fill", "none").attr("stroke", C.belief).attr("stroke-opacity", .55).attr("stroke-width", 1.6); } };
}
function profileChart(container, w, h, key, label) {
  const ki = { gs: 0, hdg: 1, vr: 2 }[key], tf = key === "hdg" ? unwrap : v => v;
  const fin = F.ctrl[NS].flat().map(c => tf(c[ki])), tr = truthIdx.map(i => tf(S.truth.ctrl[i][ki])), pa = S.past.ctrl.map(c => tf(c[ki]));
  let [lo, hi] = d3.extent([...fin, ...tr, ...pa]); const pad = Math.max((hi - lo) * .15, key === "gs" ? 10 : key === "hdg" ? 10 : 300); lo -= pad; hi += pad;
  const s = d3.select(container).append("svg").attr("width", w).attr("height", h);
  const tmin = Math.min(-5, ...S.past.t_s);
  const x = d3.scaleLinear([tmin, H], [44, w - 6]), y = d3.scaleLinear([lo, hi], [h - 20, 16]);
  s.append("g").attr("class", "axis").attr("transform", `translate(0,${h - 20})`).call(d3.axisBottom(x).ticks(5).tickFormat(v => v + "s"));
  s.append("g").attr("class", "axis").attr("transform", "translate(44,0)").call(d3.axisLeft(y).ticks(4).tickFormat(v => key === "hdg" ? ((v % 360 + 360) % 360).toFixed(0) : d3.format("~s")(v)));
  s.append("text").attr("x", 48).attr("y", 11).attr("font-size", 11).attr("font-weight", 600).attr("fill", C.text).text(label);
  s.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", 14).attr("y2", h - 20).attr("stroke", C.muted).attr("stroke-dasharray", "2 3");
  const ln = d3.line().defined(p => p[1] != null && isFinite(p[1])).x(p => x(p[0])).y(p => y(p[1]));
  s.append("path").attr("d", ln(S.past.t_s.map((t, i) => [t, pa[i]]))).attr("fill", "none").attr("stroke", C.past).attr("stroke-width", 2).attr("stroke-dasharray", "3 3");
  const g = s.append("g");
  s.append("path").attr("d", ln(d3.range(H).map(i => [i, S.truth.mask[i] ? tf(S.truth.ctrl[i][ki]) : null]))).attr("fill", "none").attr("stroke", C.truth).attr("stroke-width", 2.4);
  return { update(ctrls) {
    g.selectAll("path").data(ctrls).join("path").attr("d", c => ln(c.map((v, i) => [i, Math.max(lo - 1e3, Math.min(hi + 1e3, tf(v[ki])))])))
      .attr("fill", "none").attr("stroke", C.belief).attr("stroke-opacity", .5).attr("stroke-width", 1.3);
  }, clip: s.append("defs") };
}
const interpStep = (arr, f) => {               // arr: [S+1][k][H][3]; fractional step f
  const i = Math.min(Math.floor(f), NS - 1), r = Math.min(1, f - i);
  if (f >= NS) return arr[NS];
  return arr[i].map((smp, k) => smp.map((p, t) => p.map((v, c) => c === 1 && arr === F.ctrl ? angLerp(v, arr[i + 1][k][t][c], r) : lerp(v, arr[i + 1][k][t][c], r))));
};

// ---------------------------------------------------------------------- panels
const panels = {};
panels.past = d => {
  d.append(...head("Past ADS-B observations", `${PV.length} raw samples · [dx, dy, alt, gs, sin ψ, cos ψ, v/s] + Δt`,
    "The past is fed exactly as observed: raw ADS-B samples in the half-minute before the instruction, each keeping its own time before onset. Nothing is interpolated onto a grid, so irregular cadence and dropouts are visible to the model rather than smoothed over. Positions are relative to the onset (the black dot)."));
  const r = el("div", { class: "row2" }), a = el("div"), b = el("div"); r.append(a, b); d.append(r);
  requestAnimationFrame(() => {
    planChart(a, a.clientWidth, 300, null, { truthAlpha: .15 }).update([]);
    const pc = profileChart(b, b.clientWidth, 145, "gs", "ground speed (kt)"); pc.update([]);
    const pc2 = profileChart(b, b.clientWidth, 145, "vr", "vertical rate (fpm)"); pc2.update([]);
    const tbl = el("div", { class: "kv", style: "margin-top:10px" });
    tbl.append(el("span", { class: "k" }, "cadence"), el("span", { class: "mono" }, `median Δ ${d3.median(d3.pairs(S.past.t_s).map(([p, q]) => q - p)).toFixed(1)} s, max ${d3.max(d3.pairs(S.past.t_s).map(([p, q]) => q - p)).toFixed(1)} s`),
      el("span", { class: "k" }, "token input"), el("span", { class: "mono" }, "Linear(7 → 128) + time embedding of Δt (sinusoid · MLP)"));
    a.append(tbl);
  });
};
panels.aircraft = d => {
  d.append(...head("Aircraft performance class", `wake ⊕ engine ⊕ engines/4 → MLP → [${D.dim}]`,
    "Only the performance class is used, never the type code or the callsign, which would be memorised. The same instruction is flown two to four times faster by a narrowbody than by a light single, so without this the airframe's variance would be mistaken for instruction uncertainty. The embedding modulates the past encoder (FiLM) and every DiT block (adaLN)."));
  d.append(el("div", { class: "kv" }, el("span", { class: "k" }, "wake category"), el("span", { class: "mono" }, S.aircraft.wake),
    el("span", { class: "k" }, "engine class"), el("span", { class: "mono" }, S.aircraft.engine), el("span", { class: "k" }, "engines"), el("span", { class: "mono" }, S.aircraft.n_engines),
    el("span", { class: "k" }, "past-encoder FiLM ‖γ‖, ‖β‖"), el("span", { class: "mono" }, `${S.aircraft.film_gamma.toFixed(2)}, ${S.aircraft.film_beta.toFixed(2)}`)));
  const cv = el("canvas", { class: "hm", style: "margin-top:12px" }); d.append(el("div", { class: "label", style: "margin-top:12px" }, "aircraft embedding"), cv);
  heat(cv, matrix(S.aircraft.emb), { cw: 6, ch: 22 });
};
panels.instruction = d => {
  const dv = S.directive;
  d.append(...head("Instruction δ", "[10] = lateral [4] · vertical [3] · speed [3]",
    "The structured instruction, from the oracle or decoded by Stage 1. Each axis carries its whole command: whether it is present, its direction, and its target. Heading enters as sin and cos, so 355° and 005° are close. A dropped instruction (the no-instruction baseline) swaps in three learned null tokens."));
  const axes = [["Lateral", dv.lateral.present ? `turn ${dv.lateral.right ? "right" : "left"} heading ${fmt.hdg(dv.lateral.hdg)}` : "no turn", [0, 4]],
    ["Vertical", dv.vertical.present ? `${dv.vertical.climb ? "climb" : "descend"} to ${fmt.alt(dv.vertical.alt_ft)}` : "no altitude change", [4, 7]],
    ["Speed", dv.speed.present ? `${dv.speed.accel ? "increase" : "reduce"} to ${fmt.n(dv.speed.kt)} kt` : "no speed change", [7, 10]]];
  const names = ["has_turn", "right", "sin ψ", "cos ψ", "has_vert", "climb", "alt/45k", "has_spd", "accel", "spd/600"];
  const g = el("div", { class: "row3" });
  const toks = matrix(dv.tokens);
  axes.forEach(([n, txt, [a, b]], ai) => {
    const c = el("div", { class: "axis-card" }, el("div", { class: "label" }, n), el("div", { style: "font-weight:600;margin:3px 0 6px" }, txt),
      el("div", { class: "kv" }, ...d3.range(a, b).flatMap(i => [el("span", { class: "k mono" }, names[i]), el("span", { class: "mono" }, dv.vec[i].toFixed(3))])));
    const cv = el("canvas", { class: "hm", style: "margin-top:8px" }); c.append(el("div", { class: "label", style: "margin-top:8px" }, `token ${ai + 1} · ‖·‖ ${dv.token_norm[ai].toFixed(2)}`), cv);
    g.append(c); requestAnimationFrame(() => heat(cv, [toks[ai]], { cw: 2, ch: 18 }));
  });
  d.append(g);
};
panels.noise = d => {
  d.append(...head("Source noise x₀", `[${K} × ${H} × 4] ~ N(0, I)`,
    "Rectified flow begins from pure Gaussian noise over the future controls and transports it to the trajectory distribution along nearly straight paths. Each sample starts from different noise, and that difference is what produces the spread of the execution ensemble. Below are those starting points, dead-reckoned as if they were controls."));
  const r = el("div", { class: "row2" }), a = el("div"), b = el("div"); r.append(a, b); d.append(r);
  requestAnimationFrame(() => { planChart(a, a.clientWidth, 320, null, { truthAlpha: .25 }).update(F.pos[0].map(p => p.map(q => [q[0], q[1]])));
    const pc = profileChart(b, b.clientWidth, 150, "gs", "ground speed (kt) at t = 0"); pc.update(F.ctrl[0]);
    const pc2 = profileChart(b, b.clientWidth, 150, "hdg", "heading (°) at t = 0"); pc2.update(F.ctrl[0]); });
};
panels.acemb = panels.aircraft;
panels.dirtok = panels.instruction;
panels.pastenc = d => {
  d.append(...head("Past encoder", `Linear + time-embed → FiLM(aircraft) → ${D.past_layers} × pre-LN self-attention`,
    "The observed past is encoded once into context tokens that every flow step can read. Self-attention lets each observation relate to the others; for example, recent samples can weigh how fast the heading has been changing."));
  const ctr = el("div", { class: "ctrls" }), ls = el("div", { class: "seg" }), hs = el("div", { class: "seg" });
  let L = 0, h = -1;
  d3.range(D.past_layers).forEach(i => ls.append(el("button", { onclick: () => { L = i; draw(); } }, `layer ${i + 1}`)));
  ["avg", ...d3.range(D.heads)].forEach(v => hs.append(el("button", { onclick: () => { h = v === "avg" ? -1 : v; draw(); } }, v === "avg" ? "all heads" : `head ${v + 1}`)));
  ctr.append(el("span", { class: "label" }, "layer"), ls, el("span", { class: "label" }, "head"), hs);
  const r = el("div", { class: "row2" }), a = el("div"), b = el("div"); r.append(a, b); d.append(ctr, r);
  function draw() {
    [...ls.children].forEach((x, i) => x.classList.toggle("on", i === L)); [...hs.children].forEach((x, i) => x.classList.toggle("on", i === h + 1));
    a.innerHTML = ""; b.innerHTML = "";
    const A = deq(S.past.layers[L].attn), n = PV.length, cs = Math.min(15, (a.clientWidth - 70) / n);
    const s = d3.select(a).append("svg").attr("width", 70 + n * cs).attr("height", 40 + n * cs);
    const at = (q, k) => h < 0 ? d3.mean(d3.range(D.heads), i => A.at(i, PV[q], PV[k])) : A.at(h, PV[q], PV[k]);
    for (let q = 0; q < n; q++) for (let k = 0; k < n; k++)
      s.append("rect").attr("x", 60 + k * cs).attr("y", 30 + q * cs).attr("width", cs - 1).attr("height", cs - 1).attr("fill", seqColor(Math.min(1, at(q, k) * 3)))
        .on("mousemove", ev => tip.show(`obs at ${S.past.t_s[q].toFixed(1)}s → ${S.past.t_s[k].toFixed(1)}s<br><b>${at(q, k).toFixed(3)}</b>`, ev)).on("mouseleave", () => tip.hide());
    s.append("text").attr("x", 60).attr("y", 20).attr("font-size", 10.5).attr("fill", C.muted).text("key: observation (oldest → newest)");

    const Ld = S.past.layers[L], mx = Math.max(...Ld.attn_norm, ...Ld.ffn_norm), sb = d3.select(b).append("svg").attr("width", b.clientWidth).attr("height", 220);
    const x = d3.scaleLinear([Math.min(...S.past.t_s), 0], [40, b.clientWidth - 10]), y = d3.scaleLinear([0, mx], [190, 20]);
    sb.append("g").attr("class", "axis").attr("transform", "translate(0,190)").call(d3.axisBottom(x).ticks(6).tickFormat(v => v + "s"));
    sb.append("text").attr("x", 40).attr("y", 12).attr("font-size", 11).attr("font-weight", 600).attr("fill", C.text).text("residual update size per observation");
    [[Ld.attn_norm, C.belief], [Ld.ffn_norm, C.accent]].forEach(([arr, col]) => sb.append("path").attr("d", d3.line()(PV.map((p, i) => [x(S.past.t_s[i]), y(arr[p])]))).attr("fill", "none").attr("stroke", col).attr("stroke-width", 2));
    b.append(el("div", { class: "legend-inline" }, el("span", {}, el("i", { style: `background:${C.belief}` }), "‖self-attention update‖"), el("span", {}, el("i", { style: `background:${C.accent}` }), "‖FFN update‖")));
  }

panels.memory = d => {

    "Everything the flow is allowed to know about the situation, held as one sequence that every DiT block cross-attends into. Padded past slots are masked out. The three instruction tokens sit at the end, so attention to them is attention to the instruction."));
  const labs = S.memory.labels, cs = Math.max(18, Math.min(34, (d.clientWidth - 40) / labs.length));
  const s = d3.select(d).append("svg").attr("width", labs.length * cs + 40).attr("height", 120);

    s.append("text").attr("transform", `translate(${20 + i * cs + cs / 2},44) rotate(-55)`).attr("font-size", 10).attr("class", "mono").attr("fill", ax ? C.text : C.muted).text(l);

    el("span", {}, el("i", { style: `background:${rgba(C.oracle, .7)}` }), "instruction axis token"), el("span", {}, el("i", { style: `background:${C.surface2};border:1px dashed ${C.border}` }), "padding (masked)")));
};
panels.dit = d => {
  d.append(...head(`DiT block internals`, `${D.blocks} blocks · self-attn over ${H} future steps · cross-attn into ${D.mem} memory tokens · MLP · adaLN-zero`,
    "Inside each block the future sequence attends to itself, which keeps the trajectory smooth, then cross-attends into the memory (past plus instruction), then passes through an MLP. Flow-time and the aircraft set a shift, scale and gate on each sublayer (adaLN-zero). Choose a flow step and a block to see what it reads."));
  const ctr = el("div", { class: "ctrls" }), bs = el("div", { class: "seg" }), hs = el("div", { class: "seg" });
  let st = Math.floor(NS / 2), B = D.blocks - 1, h = -1;
  const slider = el("input", { type: "range", min: 0, max: NS - 1, value: st, style: "width:180px", oninput: ev => { st = +ev.target.value; draw(); } });
  const tl = el("span", { class: "mono" });
  d3.range(D.blocks).forEach(i => bs.append(el("button", { onclick: () => { B = i; draw(); } }, `block ${i + 1}`)));
  ["avg", ...d3.range(D.heads)].forEach(v => hs.append(el("button", { onclick: () => { h = v === "avg" ? -1 : v; draw(); } }, v === "avg" ? "all heads" : `head ${v + 1}`)));
  ctr.append(el("span", { class: "label" }, "flow step"), slider, tl, el("span", { class: "label" }, "block"), bs, el("span", { class: "label" }, "head"), hs);
  const top = el("div", { class: "row2" }), a = el("div"), b = el("div"); top.append(a, b);
  const bottom = el("div", { class: "row2", style: "margin-top:14px" }), c = el("div"), e = el("div"); bottom.append(c, e);
  d.append(ctr, top, bottom);
  const M = D.mem, labs = S.memory.labels, validM = d3.range(M).filter(i => !S.memory.pad[i]);
  function draw() {
    [...bs.children].forEach((x, i) => x.classList.toggle("on", i === B)); [...hs.children].forEach((x, i) => x.classList.toggle("on", i === h + 1));
    tl.textContent = `t = ${(st / NS).toFixed(2)}`;
    a.innerHTML = ""; b.innerHTML = ""; c.innerHTML = ""; e.innerHTML = "";
    const ca = (q, k) => h < 0 ? d3.mean(d3.range(D.heads), i => CA.at(st, B, i, q, k)) : CA.at(st, B, h, q, k);
    // cross-attention: future step (rows) × memory token (columns)
    a.append(el("div", { class: "label" }, "cross-attention · future step → memory"));
    const cw = Math.max(6, Math.min(14, (a.clientWidth - 60) / validM.length)), chh = 4;
    const s = d3.select(a).append("svg").attr("width", 50 + validM.length * cw).attr("height", 70 + H * chh);
    validM.forEach((k, j) => {
      for (let q = 0; q < H; q++) s.append("rect").attr("x", 40 + j * cw).attr("y", 54 + q * chh).attr("width", cw - .5).attr("height", chh).attr("fill", seqColor(Math.min(1, ca(q, k) * 2.5)))
        .on("mousemove", ev => tip.show(`future +${q}s reads <b>${labs[k]}</b><br>${ca(q, k).toFixed(3)}`, ev)).on("mouseleave", () => tip.hide());
      s.append("text").attr("transform", `translate(${40 + j * cw + cw / 2},50) rotate(-60)`).attr("font-size", 9.5).attr("class", "mono").attr("fill", k >= M - 3 ? C.text : C.muted).attr("font-weight", k >= M - 3 ? 700 : 400).text(labs[k]);
    });
    [0, 15, 30, 45, 59].forEach(q => s.append("text").attr("x", 34).attr("y", 54 + q * chh + 4).attr("text-anchor", "end").attr("font-size", 9.5).attr("fill", C.muted).text(`+${q}s`));
    // self-attention: future × future
    b.append(el("div", { class: "label" }, "self-attention · future step → future step"));
    const cv = el("canvas", { class: "hm" }); b.append(cv);
    const rows = d3.range(H).map(q => d3.range(H).map(k => h < 0 ? d3.mean(d3.range(D.heads), i => SA.at(st, B, i, q, k)) : SA.at(st, B, h, q, k)));
    heat(cv, rows, { cw: 4.5, ch: 4.5, gap: 0, seq: true, max: Math.max(...rows.flat()) * .6, label: (i, j, v) => `+${i}s attends +${j}s<br><b>${v.toFixed(3)}</b>` });
    // how much each future step reads the instruction, over flow time, for this block

    const sc = d3.select(c).append("svg").attr("width", c.clientWidth).attr("height", 200);
    const x = d3.scaleLinear([0, H - 1], [40, c.clientWidth - 10]), y = d3.scaleLinear([0, 1], [180, 10]);
    sc.append("g").attr("class", "axis").attr("transform", "translate(0,180)").call(d3.axisBottom(x).ticks(6).tickFormat(v => `+${v}s`));
    sc.append("g").attr("class", "axis").attr("transform", "translate(40,0)").call(d3.axisLeft(y).ticks(4).tickFormat(d3.format(".0%")));
    for (let s2 = 0; s2 < NS; s2++) {

      sc.append("path").attr("d", d3.line()(share.map((v, q) => [x(q), y(v)]))).attr("fill", "none").attr("stroke", seqColor(.2 + .8 * s2 / Math.max(1, NS - 1))).attr("stroke-width", s2 === st ? 3 : 1.4);

    const se = d3.select(e).append("svg").attr("width", e.clientWidth).attr("height", 200);
    const xe = d3.scaleLinear([0, NS - 1], [40, e.clientWidth - 110]);
    const gates = d3.range(D.blocks).flatMap(b2 => [2, 5, 8].map((gi, n) => ({ b: b2, n, v: d3.range(NS).map(s2 => F.blocks[s2][b2].adaln[gi]) })));
    const ye = d3.scaleLinear([0, d3.max(gates, g => d3.max(g.v))], [180, 10]);

    const u = F.blocks[st][B].update;
    e.append(el("div", { class: "kv", style: "margin-top:4px" }, el("span", { class: "k" }, `block ${B + 1} at t=${(st / NS).toFixed(2)} · update norms`),
      el("span", { class: "mono" }, `self ${u[0].toFixed(3)} · cross ${u[1].toFixed(3)} · mlp ${u[2].toFixed(3)}`)));
  }
  requestAnimationFrame(draw);
};
let flowPlay = null;
panels.flow = d => {
  d.append(...head("Integrating the flow", `${NS} Euler steps of x ← x + v(x, t | memory, aircraft) / ${NS}`,
    `The network predicts a velocity that carries the noise toward a plausible future. Integrating it from t = 0 to 1 turns each of the ${K} noise samples into one execution of the instruction. Positions here are the dead-reckoned controls at the current t; the black line is what the aircraft actually flew.`));
  const ctr = el("div", { class: "ctrls" });
  const btn = el("button", { class: "btn primary" }, "▶ Integrate");
  const slider = el("input", { type: "range", min: 0, max: NS, step: 0.01, value: NS, style: "width:260px" });
  const tval = el("span", { class: "big-t" }, "t = 1.00");
  ctr.append(btn, slider, tval);
  const r = el("div", { class: "row2" }), a = el("div"), b = el("div"); r.append(a, b);
  const vbar = el("div", { style: "margin-top:12px" });
  d.append(ctr, r, vbar);
  let plan, pg, ph, pv;

  }
  let vs;
  requestAnimationFrame(() => {
    plan = planChart(a, a.clientWidth, 380);
    pg = profileChart(b, b.clientWidth, 126, "gs", "ground speed (kt)");
    ph = profileChart(b, b.clientWidth, 126, "hdg", "heading (°)");
    pv = profileChart(b, b.clientWidth, 126, "vr", "vertical rate (fpm)");
    vbar.append(el("div", { class: "label" }, "mean ‖v‖ per step · how far each step moves the samples"));
    vs = d3.select(vbar).append("svg").attr("width", vbar.clientWidth).attr("height", 54);
    const vm = F.v_norm.map(r => d3.mean(r)), mx = d3.max(vm), bw = (vbar.clientWidth - 20) / NS;
    vm.forEach((v, i) => vs.append("rect").attr("x", 10 + i * bw).attr("y", 50 - 44 * v / mx).attr("width", bw - 3).attr("height", 44 * v / mx).attr("rx", 3));
    a.append(el("div", { class: "legend-inline" }, el("span", {}, el("i", { style: `background:${C.past}` }), "observed past"), el("span", {}, el("i", { style: `background:${C.truth}` }), "recorded future"),
      el("span", {}, el("i", { style: `background:${C.belief}` }), `${K} samples at the current t`)));

panels.output = d => {
  d.append(...head("Controls to trajectory", `[${H} × (gs, sin ψ, cos ψ, v/s)] → dead reckoning → [${H} × (east, north, alt)]`,

    F.pos[NS].forEach(p => s.append("path").attr("d", d3.line()(p.map((q, i) => [x(i), y(q[2])]))).attr("fill", "none").attr("stroke", C.belief).attr("stroke-opacity", .5).attr("stroke-width", 1.4));
    s.append("path").attr("d", d3.line()(S.past.pos.map((q, i) => [x(S.past.t_s[i]), y(q[2])]))).attr("fill", "none").attr("stroke", C.past).attr("stroke-dasharray", "3 3").attr("stroke-width", 2);
    s.append("path").attr("d", d3.line()(truthIdx.map(i => [x(i), y(S.truth.pos[i][2])]))).attr("fill", "none").attr("stroke", C.truth).attr("stroke-width", 2.6);

      s.append("text").attr("x", x(H) - 4).attr("y", y(dv.alt_ft) - 5).attr("text-anchor", "end").attr("font-size", 11).attr("fill", C.text2).text(`commanded ${fmt.alt(dv.alt_ft)}`); }

// ---------------------------------------------------------------------- selection and the guided pass
function select(id) { selected = id; syncSel(); const d = $("#detail"); d.innerHTML = ""; (panels[id] || panels.flow)(d); }
const ORDER = ["past", "pastenc", "aircraft", "instruction", "memory", "noise", "dit", "flow", "output"];
const NARR = { past: "Raw ADS-B samples of the last half-minute come in.", pastenc: "They are encoded once, modulated by the aircraft class.",
  aircraft: "The performance class becomes one conditioning vector.", instruction: "The instruction becomes three axis tokens.", memory: "Past and instruction tokens form the memory the flow reads.",
  noise: "Sampling starts from pure noise over the future controls.", dit: "At each flow step the DiT stack predicts a velocity.", flow: "Integrating that velocity turns noise into trajectories.",
  output: "The controls are integrated into the predicted trajectory." };
const EDGE_FOR = { pastenc: 0, aircraft: 1, instruction: 2, memory: 3, noise: 8, dit: 6, flow: 9, output: 10 };
let running = false;
$("#play").onclick = async () => {
  if (running) return; running = true; $("#play").disabled = true;
  for (let n = 0; n < ORDER.length; n++) {
    const id = ORDER[n];
    gN.classed("lit", d => d.id === id || (id === "aircraft" && d.id === "acemb") || (id === "instruction" && d.id === "dirtok"));
    $("#status").textContent = `${n + 1}/${ORDER.length} · ${NARR[id]}`;
    select(id);
    const ei = EDGE_FOR[id];
    if (ei != null) {
      const p = document.getElementById("e" + ei), L = p.getTotalLength();
      packet.attr("opacity", 1);
      await new Promise(res => tween("pk", 700, t => { const q = p.getPointAtLength(t * L); packet.attr("cx", q.x).attr("cy", q.y); }, res));
    }
    if (id === "flow") { await sleep(300); await window._runFlow(); await sleep(800); } else await sleep(1700);
  }
  packet.attr("opacity", 0); gN.classed("lit", false); running = false; $("#play").disabled = false;
  $("#status").textContent = "Done. Click any block to look inside it.";
};
select(selected);
// a component rendered in a hidden tab starts at zero width; redraw once it has a real size
let _rw = innerWidth;
addEventListener("resize", () => { if (Math.abs(innerWidth - _rw) > 20) { _rw = innerWidth; location.reload(); } });
</script>
